name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4

      - id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          NAME="piemdm-server-${VERSION}-${GOOS}-${GOARCH}"
          EXT=""
          if [ "${GOOS}" = "windows" ]; then EXT=".exe"; fi
          cd backend
          CGO_ENABLED=0 GOOS="${GOOS}" GOARCH="${GOARCH}" \
            go build -trimpath -ldflags "-s -w" -o "../dist/${NAME}${EXT}" ./cmd/server/
          cd ..
          if [ "${GOOS}" = "windows" ]; then
            (cd dist && zip -q "${NAME}.zip" "${NAME}${EXT}" && rm "${NAME}${EXT}")
          else
            tar -C dist -czf "dist/${NAME}.tar.gz" "${NAME}" && rm "dist/${NAME}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  release:
    needs: build-backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist/
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum * > sha256sums.txt

      - uses: softprops/action-gh-release@v2
        with:
          name: PieMDM ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/sha256sums.txt
