name: Generate API Client

on:
  push:
    branches: [main]
    paths:
      - 'backend/**/*.go'
      - 'backend/docs/**'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**/*.go'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: api-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install swag
        run: go install github.com/swaggo/swag/cmd/swag@v1.16.4

      - name: Generate Swagger documentation
        working-directory: backend
        run: make swagger

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate TypeScript API client
        run: ./scripts/gen-api-client.sh

      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code shared/ || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Fail if changes detected
        if: steps.git-check.outputs.changed == 'true'
        run: |
          echo "Error: API client code is out of sync with backend changes."
          echo "Run './scripts/gen-api-client.sh' locally and commit the generated code."
          exit 1

      - name: Comment on PR
        if: steps.git-check.outputs.changed == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: 'The generated API client is out of sync with the backend.\n\nRun `./scripts/gen-api-client.sh` locally and commit the changes under `shared/`.'
            });
